name: Sync events to GitHub Project
description: >-
  Sync managed event drafts and their statuses in the repository owner's GitHub Project.
  Delete drafts that ended at least 14 days ago, falling back to their start if no valid end
  is available. Use project dates for deletion and skip expired feed entries independently.
  Leave archived and unrelated items untouched.
inputs:
  events_file:
    description: Path to the events JSON file
    required: true
  project_token:
    description: Fine-grained token with account Projects read/write
    required: true
  project_owner:
    description: Repository owner whose project is updated
    required: true
  project_number:
    description: Project number
    required: true
  report_file:
    description: Path for the JSON sync report
    default: sync-report.json
outputs:
  report_file:
    description: Path to the JSON report with event identities and status transitions
runs:
  using: node24
  main: index.js
