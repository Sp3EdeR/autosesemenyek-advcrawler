name: Ping Dependencies

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Pipe-delimited URL list to check
        required: true
        type: string

jobs:
  ping_url:
    runs-on: ubuntu-latest
    name: Ping Sites
    steps:
      - name: Check whether the websites are up
        uses: jtalk/url-health-check-action@v5
        with:
          url: ${{ inputs.urls }}
          max-attempts: 3
          retry-delay: 5s # Optional, only applicable to max-attempts > 1
          retry-all: false # Optional, defaults to "false"
        timeout-minutes: 5
